workerPoolSpecs:
  - machineSpec:
      machineType: n1-standard-8
      acceleratorType: NVIDIA_TESLA_T4
      acceleratorCount: 1
    replicaCount: 1
    diskSpec:
      bootDiskType: pd-ssd
      bootDiskSizeGb: 200
    containerSpec:
      imageUri: us-docker.pkg.dev/vertex-ai/training/pytorch-gpu.2-2.py310:latest
      command:
        - bash
        - -c
        - gcloud storage cp gs://vm-football-data/code/segmentation/sam2_finetune_startup.sh /tmp/run.sh && chmod +x /tmp/run.sh && bash /tmp/run.sh
scheduling:
  timeout: 86400s
