[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vm-football"
version = "1.0.0"
description = "TacticalVision AI: End-to-end Computer Vision Pipeline for Football Broadcast Video Analytics"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Sebastian Rs", email = "sebastian@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.22.0",
    "opencv-python>=4.6.0.66",
    "pandas>=1.5.0",
    "scipy>=1.9.0",
    "matplotlib>=3.6.0",
    "pytest>=7.0.0",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "src*", "training*"]
