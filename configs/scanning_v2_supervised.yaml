# configs/scanning_v2_supervised.yaml
# ---------------------------------------------------------------------------
# Scanning V2 — Supervised Phase.
# Entrena/refina un detector SUPERVISADO de head-turn / visual scanning
# APROXIMADO antes de la recepcion, usando ventanas anotadas por humanos.
# NO es gaze real. Solo opera sobre eventos de recepcion ya validados.
# Si no hay GT suficiente -> NO entrena y mantiene la heuristica V2 como fallback.
# ---------------------------------------------------------------------------

video:
  fps: 25

inputs:
  outputs_root: "outputs"   # lee outputs/<video_id>/scanning/
  annotations_path: "data/annotations/scanning_windows_gt.csv"
  video_ids: ["SNMOT-148"]

dataset:
  feature_version: "scanning_v2_features_v1"
  include_vision_map: true
  include_heuristic_pred_as_feature: false   # NO usar la heuristica como feature
  min_valid_pose_ratio_for_training: 0.0
  drop_low_visibility: false

model:
  type: "logistic_regression"        # logistic_regression | random_forest | gradient_boosting
  random_state: 42
  class_weight: "balanced"
  min_labeled_samples: 20
  min_positive_samples: 3
  test_size: 0.2
  val_size: 0.2
  group_split_by_video: true
  use_heuristic_pred_as_feature: false

outputs:
  root: "outputs/scanning_training_gt"

reporting:
  compare_with_heuristic: true
  write_markdown: true
  write_json: true
