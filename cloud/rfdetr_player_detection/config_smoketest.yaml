# ============================================================
# RF-DETR Smoke Test Configuration
# ============================================================
# 2-epoch smoke test that validates the FULL pipeline:
#   1. Dataset download (tar from GCS)
#   2. YOLO → COCO conversion
#   3. RF-DETR training (2 epochs)
#   4. Checkpoint save/load verification
#   5. GCS sync verification
#
# Usage:
#   .\cloud\submit_rfdetr_job.ps1 -SmokeTest
#
# Expected runtime: ~15-25 min on T4 GPU
# ============================================================

seed: 42

dataset:
  tar_path: gs://vm-football-data/reorganized_dataset.tar.gz
  gcs_path: gs://vm-football-data/reorganized_dataset
  local_path: /workspace/dataset/reorganized_dataset
  # Tiny subsets for speed — just enough to verify pipeline
  limit_train_images: 50
  limit_valid_images: 20

classes:
  unified: ["player", "goalkeeper", "referee"]
  mapping:
    0: 0     # player_left → player
    1: 0     # player_right → player
    2: 1     # goalkeeper_left → goalkeeper
    3: 1     # goalkeeper_right → goalkeeper
    4: 2     # referee → referee
    5: -1    # ball → IGNORE

output:
  base_dir: /workspace/runs
  gcs_path: gs://vm-football-data/models/rfdetr_player_gk_ref

rfdetr:
  coco_dir: /workspace/dataset_coco
  experiments:
    rfdetr_smoketest_3class:
      description: "Smoke test 3-class: 2 epochs, checkpoint save+load verification"
      model_class: RFDETRBase
      epochs: 2
      batch_size: 2
      grad_accum_steps: 1
      lr: 2.0e-4
      lr_encoder: 2.0e-5
      resolution: 448
      weight_decay: 1.0e-4
      use_ema: true
