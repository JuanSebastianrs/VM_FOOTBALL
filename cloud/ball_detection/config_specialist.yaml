dataset:
  # The script will try to download the tar file first for speed
  tar_path: "gs://vm-football-data/reorganized_dataset.tar.gz"
  gcs_path: "gs://vm-football-data/reorganized_dataset"
  local_path: "/workspace/dataset/reorganized_dataset"

output:
  base_dir: "/workspace/runs"
  gcs_path: "gs://vm-football-data/models/yolo_ball_specialist"

yolo:
  experiments:
    # EXPERIMENTO 1: Baseline (Para demostrar el problema de objetos pequeños)
    exp_01_baseline:
      description: "YOLO11 Nano por defecto. Baseline para comparar métricas."
      model: "yolo11n.pt"
      epochs: 50
      batch_size: 16  # Asumiendo 10GB VRAM
      imgsz: 1280
      hyperparameters:
        mixup: 0.1 # Por defecto (destructivo para el balón)
        copy_paste: 0.0
      
    # EXPERIMENTO 2: Data-Centric (Aislamiento de la variable de datos)
    exp_02_data_centric:
      description: "YOLO11 Nano con aumentos optimizados para micro-geometría."
      model: "yolo11n.pt"
      epochs: 50
      batch_size: 16
      imgsz: 1280
      hyperparameters:
        mixup: 0.0       # PROHIBIDO: Destruye los tensores pequeños
        copy_paste: 0.3  # OBLIGATORIO: Balancea clases artificialmente
        bgr: 0.2         # OJO: Esto altera los canales de color (Color Jittering), NO es Motion Blur
        degrees: 0.0     # Desactivado: Rotar el balón no aporta valor (es redondo)

    # EXPERIMENTO 3: Arquitectura SOTA (El modelo definitivo para inferencia)
    exp_03_p2_sota:
      description: "YOLO11 Nano modificado con Capa P2 (Stride 4) y Data-Centric configs."
      model: "yolo11n-p2.yaml" # Arquitectura custom que creamos
      epochs: 50
      batch_size: 8      # CRÍTICO: Reducido a la mitad porque la capa P2 duplicará el uso de VRAM
      imgsz: 1280
      hyperparameters:
        mixup: 0.0
        copy_paste: 0.3
        bgr: 0.2
        degrees: 0.0
