steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/vm-football/training:${_TAG}'
      - '-f'
      - 'cloud/Dockerfile'
      - '.'

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/vm-football/training:${_TAG}'

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/vm-football/training:${_TAG}'

substitutions:
  _REGION: 'us-central1'
  _TAG: 'latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: 'CLOUD_LOGGING_ONLY'

timeout: '1800s'  # 30 min max for build
